name: Manage stale issues & PRs

on:
  schedule:
    # Run once per day at 6am UTC - not more frequent to avoid rate limits
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed in 7 days if no further
            activity occurs.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not
            had recent activity. It will be closed in 7 days if no further
            activity occurs.
          close-issue-message: Closed due to inactivity.
          close-pr-message: Closed due to inactivity.
          # Avoid rate limits - process in small batches
          operations-per-run: 30
          exempt-issue-labels: pinned,security,bug
          exempt-pr-labels: pinned,security
